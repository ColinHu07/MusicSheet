[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "musicsheet-transcription"
version = "0.2.0"
description = "Local note-first music transcription and conservative notation research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
ml = ["torch>=2.2,<3", "librosa>=0.10,<0.12"]
notation = ["verovio>=4,<7", "reportlab>=4,<5", "svglib>=1.5,<2"]
lyrics = ["torch>=2.2,<3", "faster-whisper>=1.1,<2", "transformers>=4.49,<5", "phonemizer>=3.3,<4", "espeakng-loader>=0.2.4,<1"]
test = ["pytest>=8,<9"]

[project.scripts]
musicsheet = "musicsheet.cli:main"

[tool.setuptools.packages.find]
include = ["musicsheet*"]

[tool.pytest.ini_options]
testpaths = ["tests_transcription"]
pythonpath = ["."]
